services:
  - type: web
    name: sign-language-lstm
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run sign_language_lstm/streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STUN_URL
        value: "stun:stun.relay.metered.ca:80"
      - key: TURN_URL
        value: "turn:standard.relay.metered.ca:80"
      - key: TURN_USERNAME
        value: "your-metered-username"
      - key: TURN_CREDENTIAL
        value: "your-metered-password"
